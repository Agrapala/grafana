# ─────────────────────────────────────────────
#  Prometheus configuration
#  Edit the targets list to add your server IPs
# ─────────────────────────────────────────────

global:
  scrape_interval: 15s          # how often to pull metrics
  evaluation_interval: 15s      # how often to evaluate alert rules
  scrape_timeout: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - "alert.rules.yml"

scrape_configs:

  # Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # ── Your monitored hosts ─────────────────────────────────────
  # Scrape the monitoring host (via the Compose service name) and
  # the remote target host that Ansible installs Node Exporter on.
  - job_name: "node_exporter"
    static_configs:
      - targets:
          - "207.180.252.87:9100"
          - "agro.senzmate.com:9100"
        labels:
          group: "contabo-vps"

    # Optional: give each target a friendly name
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        # Remove :9100 from the instance label for cleaner display
        regex: "([^:]+)(?::\\d+)?"
        replacement: "$1"
