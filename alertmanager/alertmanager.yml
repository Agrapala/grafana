# ─────────────────────────────────────────────
#  Alertmanager configuration
#  Configure your notification channels below
# ─────────────────────────────────────────────

global:
  resolve_timeout: 5m
  # SMTP (email) settings — fill in your mail server details
  smtp_smarthost: "smtp.gmail.com:587"
  smtp_from: "alerts@yourdomain.com"
  smtp_auth_username: "alerts@yourdomain.com"
  smtp_auth_password: "your-app-password"   # use Gmail App Password
  smtp_require_tls: true

route:
  group_by: ["alertname", "instance"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "email-alerts"

  # Route critical alerts to a separate receiver (e.g. PagerDuty / SMS)
  routes:
    - match:
        severity: critical
      receiver: "email-alerts"
      repeat_interval: 1h

receivers:
  - name: "email-alerts"
    email_configs:
      - to: "you@yourdomain.com"
        send_resolved: true
        headers:
          Subject: "[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }} — {{ .GroupLabels.instance }}"

  # ── Optional: Slack notifications ────────────────────────────
  # Uncomment and fill in your webhook URL to enable
  # - name: "slack-alerts"
  #   slack_configs:
  #     - api_url: "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"
  #       channel: "#server-alerts"
  #       title: "[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}"
  #       text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"
  #       send_resolved: true

inhibit_rules:
  # Suppress warning if critical is already firing for same instance
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname", "instance"]
